name: 매일 릴스 발행

# 목표: 매일 한국시간 저녁 6시에 올린다. (깃허브는 세계시 UTC 기준, +9시간 = 한국)
#
# 깃허브 예약은 정해진 시각보다 3시간쯤 늦게 도는 게 보통이다(2026-09-12 관찰: 21:07 → 00:26).
# 그래서 오후 3시대에 미리 걸어두고, publish.py 가 6시까지 기다렸다가 올린다.
# 일찍 깨어나면 6시까지 대기, 늦게 깨어나면 바로 올림 → 6시 이전엔 절대 안 올라간다.
# 정각(:00)을 피한 이유: 정각엔 전 세계 예약이 몰려 더 늦거나 건너뛴다.
# 여러 번 걸어둔 이유: 무료 예약은 그냥 건너뛰는 날이 있다(첫날 두 번 다 안 돌았다).
# publish.py 가 '오늘 이미 올렸으면 건너뛰기'를 하므로 몇 번 돌아도 하루 한 장이다.
on:
  schedule:
    - cron: "7 6 * * *"      # 한국 15:07  ← 3시간 늦으면 18:07
    - cron: "37 6 * * *"     # 한국 15:37  (예비 1)
    - cron: "7 7 * * *"      # 한국 16:07  (예비 2)
    - cron: "7 9 * * *"      # 한국 18:07  (예비 3 — 위가 전부 안 돌았을 때)
    - cron: "37 9 * * *"     # 한국 18:37  (예비 4)
  workflow_dispatch:        # 깃허브 화면에서 손으로도 돌릴 수 있게 (이건 안 기다리고 바로 올림)

# 같은 시간대에 여러 예약이 깨어나 동시에 6시를 기다리다가 함께 올리는 사고를 막는다.
# 하나가 도는 동안 나머지는 줄을 서고, 앞 것이 올리고 나면 뒤 것은 '오늘 이미 올림'으로 건너뛴다.
concurrency:
  group: 릴스발행
  cancel-in-progress: false

permissions:
  contents: write           # queue.json 에 '올림' 표시를 하고 저장해야 하므로

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 인스타에 발행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_USER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GITHUB_SHA: ${{ github.sha }}     # 영상 주소에 커밋 번호를 붙여 캐시를 피한다
        run: python publish.py

      - name: 발행 기록 저장
        run: |
          git config user.name "saju-bot"
          git config user.email "saju-bot@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "발행 완료 $(date -u +%Y-%m-%d)"
          git push
