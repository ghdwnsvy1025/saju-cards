name: 매일 릴스 발행

# 매일 한국시간 밤 9시쯤 자동 실행됩니다. (깃허브는 세계시 UTC 기준, +9시간 = 한국)
#
# 정각(:00)을 피한 이유: 전 세계 예약이 정각에 몰려 깃허브가 한참 늦게 돌리거나
# 아예 건너뛰는 일이 흔하다. 그래서 7분에 맞춘다.
# 두 번 걸어둔 이유: 9시 것이 건너뛰어져도 10시 것이 대신 올린다.
# (publish.py 가 '오늘 이미 올렸으면 건너뛰기'를 하므로 두 장 올라가지 않는다)
on:
  schedule:
    - cron: "7 12 * * *"    # 한국 21:07
    - cron: "7 13 * * *"    # 한국 22:07 (예비)
  workflow_dispatch:        # 깃허브 화면에서 손으로도 돌릴 수 있게

permissions:
  contents: write           # queue.json 에 '올림' 표시를 하고 저장해야 하므로

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 인스타에 발행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_USER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: python publish.py

      - name: 발행 기록 저장
        run: |
          git config user.name "saju-bot"
          git config user.email "saju-bot@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "발행 완료 $(date -u +%Y-%m-%d)"
          git push
