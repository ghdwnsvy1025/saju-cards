name: 매일 릴스 발행

# 목표: 매일 한국시간 저녁 6시에 올린다. (깃허브는 세계시 UTC 기준, +9시간 = 한국)
#
# 발행 경로는 두 갈래다:
#   1) 하로님 PC의 작업 스케줄러가 18:00 정각에 workflow_dispatch 신호를 쏜다 (정확함, PC 켜져 있을 때)
#   2) 아래 깃허브 예약이 대신 돈다 (PC 꺼져 있을 때의 안전망)
# 깃허브 예약은 3시간쯤 늦게 돌거나(9/12: 21:07 → 00:26) 아예 안 도는 날이 있다(9/14: 5개 전부).
# 그래서 오후 2시부터 밤 11시 반까지 30분 간격으로 촘촘히 걸어 하나라도 걸리게 한다.
# publish.py 가 처리한다: 오후 2시 전이면 그냥 끝, 2~6시면 6시까지 대기, 6시 이후면 바로 올림.
# 몇 번 돌아도 '오늘 이미 올렸으면 건너뛰기'로 하루 한 장이다.
# 정각(:00)을 피한 이유: 정각엔 전 세계 예약이 몰려 더 늦거나 건너뛴다.
on:
  schedule:
    - cron: "7,37 5-14 * * *"   # 한국 14:07 ~ 23:37, 30분 간격 (UTC 05~14시)
  workflow_dispatch:            # PC 스케줄러·깃허브 화면의 수동 실행 (기다리지 않고 바로 올림)

# 같은 시간대에 여러 예약이 깨어나 동시에 6시를 기다리다가 함께 올리는 사고를 막는다.
# 하나가 도는 동안 나머지는 줄을 서고, 앞 것이 올리고 나면 뒤 것은 '오늘 이미 올림'으로 건너뛴다.
concurrency:
  group: 릴스발행
  cancel-in-progress: false

permissions:
  contents: write           # queue.json 에 '올림' 표시를 하고 저장해야 하므로

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 인스타에 발행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_USER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GITHUB_SHA: ${{ github.sha }}     # 영상 주소에 커밋 번호를 붙여 캐시를 피한다
        run: python publish.py

      - name: 발행 기록 저장
        run: |
          git config user.name "saju-bot"
          git config user.email "saju-bot@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || git commit -m "발행 완료 $(date -u +%Y-%m-%d)"
          git push
